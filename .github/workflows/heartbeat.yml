name: daily-heartbeat

# Three runs a day, weekdays. Cron is UTC:
#   06:35 UTC = 12:05 IST — midday action brief (reminders due + IPO screener)
#   09:45 UTC = 15:15 IST — IPO last call: issues closing today, judged on
#     near-final books (SME subscriptions multiply after 2pm, so the midday
#     numbers can't clear bars calibrated on closing books). Sends only when
#     something passes or is one bar away; silence = nothing to decide.
#   10:15 UTC = 15:45 IST — market digest just after the 15:30 close
on:
  schedule:
    - cron: "35 6 * * 1-5"
    - cron: "45 9 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

# the midday run logs tracked shop prices back into state/
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-watcher.txt
      - run: pip install -r requirements-watcher.txt
      - name: send daily digest
        env:
          STOCKWATCH_TG_TOKEN: ${{ secrets.STOCKWATCH_TG_TOKEN }}
          STOCKWATCH_TG_CHAT: ${{ secrets.STOCKWATCH_TG_CHAT }}
          STOCKWATCH_SMTP_USER: ${{ secrets.STOCKWATCH_SMTP_USER }}
          STOCKWATCH_SMTP_PASS: ${{ secrets.STOCKWATCH_SMTP_PASS }}
          STOCKWATCH_EMAIL_TO: ${{ secrets.STOCKWATCH_EMAIL_TO }}
          # lets the digest read the encrypted advice ledger for review-due nudges;
          # absent = that section is silently skipped, nothing else changes
          STOCKWATCH_STATE_KEY: ${{ secrets.STOCKWATCH_STATE_KEY }}
        run: |
          python -m src.repo_state import
          # route by UTC hour: <09 midday brief, 09 = 15:15 IST last call,
          # anything later is the after-close digest
          H="$(date -u +%H)"
          if [ "$H" -lt 9 ]; then
            python -m src.heartbeat morning
          elif [ "$H" -eq 9 ]; then
            python -m src.heartbeat lastcall
          else
            python -m src.heartbeat
          fi
      - name: commit tracked-price points
        run: |
          git config user.name "stock-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/shop_watch.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no tracked-price change"
          else
            git commit -m "chore: log tracked prices [skip ci]"
            git pull --rebase origin main
            git push
          fi
